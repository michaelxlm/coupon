# ==========================================================================
# coupon.zangeng.com · Nginx 配置（参考实现，非线上直接套用）
# --------------------------------------------------------------------------
# ⚠️ 生产服务器 60.205.214.88 是【宝塔面板(BT)】，vhost 由面板托管，路径与本文不同：
#   · vhost 文件：/www/server/panel/vhost/nginx/html_coupon.zangeng.com.conf
#   · 站点根目录：root /www/wwwroot/coupon.zangeng.com   （deploy workflow 的 tar 目标）
#   · 证书：/www/server/panel/vhost/cert/coupon.zangeng.com/{fullchain,privkey}.pem
#   · 增量配置：/www/server/panel/vhost/nginx/extension/coupon.zangeng.com/*.conf（被 vhost include）
#   直接 `cp` 本文件到 /etc/nginx/conf.d/ 会写错 root / 证书路径，导致站点 404 / reload 失败，切勿这样做。
#
# 本文件作为「期望规则」的单一参考，供迁移到自管 nginx 或对照排查；在 BT 上落地方式：
#   - 安全响应头（X-Content-Type-Options / Referrer-Policy / CSP frame-ancestors WO-84）：
#     已按本文件口径写入 extension/coupon.zangeng.com/security.conf（2026-10-13 实跑 reload 生效）。
#   - /data/coupon-snapshot.json：BT 默认即对外 200（application/json + no-cache），兜底回退已可用，
#     无需额外放行；data/ 下 categories.json / ad-slots.json 本就要被前端 fetch，保持公开即可。
#   - 券详情页 /p/ 动态回退 + 旧链 301：见下方「路由」段，落地写入
#     extension/coupon.zangeng.com/p-fallback.conf（try_files 回退壳）与
#     extension/coupon.zangeng.com/p-redirects.conf（build 的 data/p-redirect-map.json 生成的 301 表）；
#     每次改完先 `nginx -t` 校验再 reload，防旧链断崖。
# ==========================================================================

# ------------------------------- HTTP → HTTPS ------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name coupon.zangeng.com;

    # 证书申请用的校验目录要放行
    location ^~ /.well-known/acme-challenge/ { root /var/www/coupon-zangeng; }

    location / { return 301 https://coupon.zangeng.com$request_uri; }
}

# ---------------------------------- HTTPS ----------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name coupon.zangeng.com;

    root /var/www/coupon-zangeng;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/coupon.zangeng.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coupon.zangeng.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ------------------------------ 安全响应头 ------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 跨站域名业务白名单（WO-84）：允许本网络伙伴站点 iframe 内嵌本站能力。
    # X-Frame-Options 无法表达多源，改用 CSP frame-ancestors（现代浏览器以其为准，故不再发 SAMEORIGIN）。
    # 白名单须与 main-api/shared/capabilities.json 的 embedAllowlist 单一源保持一致，改动同步。
    add_header Content-Security-Policy "frame-ancestors 'self' https://2002cs.com https://fangkelianmeng.com https://xuliming.com https://xuyiheng.com https://585.ink https://20101115.com https://zangeng.com https://coupon.zangeng.com" always;

    # ------------------------------ 压缩 ------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml text/xml;

    # ------------------------------ 缓存策略 ------------------------------
    # HTML 不缓存：改版立刻生效，且 404 页不会被缓存成 200
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # assets/ 长缓存：文件名带 ?v=build_version，改版改号即可整体失效
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # JSON 必须显式声明类型，否则部分浏览器会当附件下载
    location ~* \.json$ {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }

    # SVG 图标
    location ~* \.svg$ {
        add_header Content-Type "image/svg+xml" always;
    }

    # ------------------------------ 不该被访问的目录 ------------------------------
    # 构建期快照：运行时后端不可达时的兜底数据源，放行且禁止缓存（随部署刷新）
    location = /data/coupon-snapshot.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /data/     { return 404; }
    location ^~ /scripts/  { return 404; }
    location ^~ /reports/  { return 404; }
    location = /package.json { return 404; }

    # ------------------------------ 真 404 ------------------------------
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    # ------------------------------ 路由 ------------------------------
    # 首页只保留目录形式：/index.html 与 / 内容相同，会被判成重复网页
    location = /index.html { return 301 /; }

    # ===== 券详情页 /p/<_id>.html：静态优先 + 动态回退壳（同 URL 恒不 404） =====
    # 详池预渲染的 /p/<_id>.html 直接命中静态文件；未预渲染的长尾券内部落到恒存在的
    # /p/_shell.html（HTTP 200，非 404），由 detail-shell.js 读 pathname 取 _id 调 jd/detail 水合。
    #  ^~ 前缀必需：否则被上方 `location ~* \.html$` 正则抢匹配，缺失文件直接 404、回退失效。
    location ^~ /p/ {
        try_files $uri /p/_shell.html;
        # /p/ 下 HTML 一律不缓存（含壳），保证回退与水合内容随部署即时生效
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    # 壳文件本身绝不落地缓存（长尾券每次都水合最新数据）
    location = /p/_shell.html {
        add_header Cache-Control "no-cache" always;
    }

    # ===== 旧链 301 迁移（已收录的 safeId(tao_id) URL → 新 _id URL） =====
    # 一次性运维：build 产出 data/p-redirect-map.json（safeId → _id），据此生成
    #   extension/coupon.zangeng.com/p-redirects.conf，形如：
    #     location = /p/<旧safeId>.html { return 301 /p/<_id>.html; }
    # include 进来后旧链精确命中先 301；未命中的旧链会落到上面 /p/ 回退壳（壳对
    #   非 24hex 键会回落榜单，不出坏链）。生成脚本参照 build.js 的 p-redirect-map.json。
    include /www/server/panel/vhost/nginx/extension/coupon.zangeng.com/p-redirects.conf;

    location / {
        try_files $uri $uri/index.html =404;
    }

    location = /sitemap.xml { add_header Cache-Control "no-cache" always; }
    location = /robots.txt  { add_header Cache-Control "no-cache" always; }

    access_log /var/log/nginx/coupon.zangeng.com.access.log;
    error_log  /var/log/nginx/coupon.zangeng.com.error.log;
}
