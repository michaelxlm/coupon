# ==========================================================================
# coupon.zangeng.com · Nginx 部署配置
# 用法：另存为 /etc/nginx/conf.d/coupon.zangeng.com.conf，改下面 3 处后 nginx -t && nginx -s reload
#   1) root      站点目录（把仓库内容拷到这里，不需要 data/ 与 scripts/）
#   2) server_name 与证书路径
#   3) 如需对象存储 / CDN，本文件不适用，见 README「部署」一节
# ==========================================================================

# ------------------------------- HTTP → HTTPS ------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name coupon.zangeng.com;

    # 证书申请用的校验目录要放行
    location ^~ /.well-known/acme-challenge/ { root /var/www/coupon-zangeng; }

    location / { return 301 https://coupon.zangeng.com$request_uri; }
}

# ---------------------------------- HTTPS ----------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name coupon.zangeng.com;

    root /var/www/coupon-zangeng;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/coupon.zangeng.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coupon.zangeng.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ------------------------------ 安全响应头 ------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ------------------------------ 压缩 ------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml text/xml;

    # ------------------------------ 缓存策略 ------------------------------
    # HTML 不缓存：改版立刻生效，且 404 页不会被缓存成 200
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # assets/ 长缓存：文件名带 ?v=build_version，改版改号即可整体失效
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # JSON 必须显式声明类型，否则部分浏览器会当附件下载
    location ~* \.json$ {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }

    # SVG 图标
    location ~* \.svg$ {
        add_header Content-Type "image/svg+xml" always;
    }

    # ------------------------------ 不该被访问的目录 ------------------------------
    location ^~ /data/     { return 404; }
    location ^~ /scripts/  { return 404; }
    location ^~ /reports/  { return 404; }
    location = /package.json { return 404; }

    # ------------------------------ 真 404 ------------------------------
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    # ------------------------------ 路由 ------------------------------
    # 首页只保留目录形式：/index.html 与 / 内容相同，会被判成重复网页
    location = /index.html { return 301 /; }

    location / {
        try_files $uri $uri/index.html =404;
    }

    location = /sitemap.xml { add_header Cache-Control "no-cache" always; }
    location = /robots.txt  { add_header Cache-Control "no-cache" always; }

    access_log /var/log/nginx/coupon.zangeng.com.access.log;
    error_log  /var/log/nginx/coupon.zangeng.com.error.log;
}
