# 静态站统一部署（push-to-deploy），由 39.107 上 self-hosted runner 执行
# runner 用自身 /root/.ssh/id_rsa 登录 60.205.214.88，无需在仓库存密钥
# 采用 shell:bash + Linux 原生 tar/ssh（路径在 /root/.ssh）
name: Deploy coupon.zangeng.com

on:
  push:
    branches: [main]
  # 定时重建：优惠券时效短，每日重建让百度等爬虫抓到新鲜券（UTC 00:20 / 08:20 ≈ 北京 08:20 / 16:20）
  schedule:
    - cron: '20 0,8 * * *'
  # 允许从管理端（GitHub API workflow_dispatch）手动触发部署，无需重新 push
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, static-deploy]
    steps:
      - name: Configure SSH for GitHub checkout
        shell: bash
        run: |
          # 用 runner 本地 /root/.ssh 私钥走 SSH 拉代码，规避 HTTPS(443) 超时
          # 用 --system + 绝对路径：runner 环境 $HOME 未设置，--global 会报错且 checkout 读不到
          git config --system url."git@github.com:".insteadOf "https://github.com/"
          mkdir -p /root/.ssh && chmod 700 /root/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> /root/.ssh/known_hosts 2>/dev/null
      - uses: actions/checkout@v4
      - name: Setup Node (for prerender)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pre-render coupons (SEO / 百度可索引)
        shell: bash
        # fail-soft：build.js 内部已捕获所有异常并 exit 0，取不到券/上游不可达时保持原 HTML，绝不阻断部署
        run: node scripts/build.js
      # 内容哈希指纹：为静态资源生成 <name>.<hash>.<ext> 并改写 HTML/CSS 引用（配合服务器 immutable 长缓存）。须排在 build.js 之后
      - name: Content hash fingerprint
        shell: bash
        run: node scripts/fingerprint.js
      # 部署前质量门：chrome 标记 / 兜底快照 / 指纹生效校验（关键项失败则阻断 sync）
      - name: Self check
        shell: bash
        run: node scripts/selfcheck.js
      - name: Sync to /www/wwwroot/coupon.zangeng.com
        shell: bash
        run: |
          tar cf - --exclude=.git --exclude=.github --exclude=.user.ini --exclude=.workbuddy . | ssh -i /root/.ssh/id_rsa -o StrictHostKeyChecking=accept-new root@60.205.214.88 "mkdir -p /www/wwwroot/coupon.zangeng.com ; cd /www/wwwroot/coupon.zangeng.com ; tar xmf -"
